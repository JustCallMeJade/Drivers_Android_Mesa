name: PanVK

on:
  workflow_run:
    workflows:
     ["build-turnip.yml"]
    types: 
    - requested

  workflow_dispatch:

permissions:
  contents: write

env:
  API_VER: 36

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run build script
        run: |
         sudo apt update && bash Build-PanVK.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: turnip-build
          path: pan_workdir/output/lib/*.zip
          if-no-files-found: error
